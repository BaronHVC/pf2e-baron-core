name: Module release

# Workflow reutilizable: lo llama el release.yml de cada modulo de la familia
# al empujar una etiqueta v*.
#
#   on:
#     push:
#       tags:
#         - "v*"
#   permissions:
#     contents: write
#   jobs:
#     release:
#       uses: BaronHVC/pf2e-baron-core/.github/workflows/module-release.yml@<sha>
#
# El modulo que llama TIENE que conceder `contents: write`: un workflow
# reutilizable solo puede reducir los permisos que recibe, nunca ampliarlos, y
# sin escritura no puede crear el release. <sha> = commit de baron-core.lock.json
# (sync-core lo reescribe); sin ese lock no hay commit del core que usar, asi que
# solo sirve a modulos que ya vendorizan el core.
#
# Primero corre las mismas revisiones y pruebas que module-check.yml; despues
# reproduce el release.yml de pf2e-simple-weapon-editor v0.12.0: version desde
# la etiqueta, prerelease para lo que no sea vX.Y.Z, module.json reescrito, ZIP
# con la carpeta <id>/ adentro, release por version y canal de pruebas "dev".
#
# El module.json lo reescribe tools/release-manifest.mjs del core (el del commit
# del lock, con sus pruebas), en los dos modos de baron.json:
#
# - public: lo de arriba.
# - protected (modulo de pago, un complemento freemium): solo desde un repo
#   PRIVADO. module.json con "protected": true, sin download, con el manifest que
#   hospeda Foundry y la landingUrl de baron.json como url; falla si algo sigue
#   apuntando a GitHub. El ZIP y ese module.json quedan en un release del
#   propio repo privado, nunca en el canal "dev", y el resumen del run trae la
#   lista para subirlo a mano a foundryvtt.com: Foundry no tiene API para subir
#   paquetes protegidos.
on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # El contexto github es el del modulo que llama: el evento push de su
      # etiqueta dice si su repo es privado.
      - name: Leer baron.json
        id: baron
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          node -e '
            const fs = require("fs");
            const defaults = { mode: "public", devChannel: true };
            let given = {};
            if (fs.existsSync("baron.json")) given = JSON.parse(fs.readFileSync("baron.json", "utf8"));
            else console.log("::notice::sin baron.json: modo public y canal de pruebas activo");
            const cfg = { ...defaults, ...given };
            if (cfg.mode !== "public" && cfg.mode !== "protected") {
              console.log("::error file=baron.json::mode debe ser public o protected, no " + JSON.stringify(cfg.mode));
              process.exit(1);
            }
            let dev = cfg.devChannel !== false;
            let landing = "";
            if (cfg.mode === "protected") {
              // Los archivos de un release de un repo publico los baja
              // cualquiera: un modulo de pago ahi ya se regalo. Mejor fallar.
              if (process.env.REPO_PRIVATE !== "true") {
                console.log("::error file=baron.json::mode protected (modulo de pago) solo se publica desde un repo privado, y este no lo es (github.event.repository.private = " + JSON.stringify(process.env.REPO_PRIVATE) + "): haz privado el repo antes de etiquetar, o usa mode public");
                process.exit(1);
              }
              // Nunca canal de pruebas: sus archivos quedarian en un release,
              // fuera del acceso por Patreon que controla Foundry.
              if (given.devChannel === true) console.log("::notice file=baron.json::devChannel se ignora en mode protected: un modulo de pago nunca publica el canal dev");
              dev = false;
              // check-module [m] y release-manifest validan la URL; aqui solo
              // se impide que un salto de linea escriba otras salidas del paso.
              if (typeof cfg.landingUrl === "string") landing = cfg.landingUrl;
              if (/[\r\n]/.test(landing)) {
                console.log("::error file=baron.json::landingUrl no puede tener saltos de linea");
                process.exit(1);
              }
            }
            const out = (line) => fs.appendFileSync(process.env.GITHUB_OUTPUT, line + "\n");
            out("mode=" + cfg.mode);
            out("devChannel=" + dev);
            out("landingUrl=" + landing);
            console.log("modo " + cfg.mode + ", canal de pruebas " + (dev ? "si" : "no"));
          '

      - name: Leer el commit del core en baron-core.lock.json
        id: lock
        run: |
          node -e '
            const fs = require("fs");
            // Los workflows compartidos necesitan la copia vendorizada: el lock
            // dice en que commit del core estan las herramientas.
            if (!fs.existsSync("baron-core.lock.json")) {
              console.log("::error file=baron-core.lock.json::no existe baron-core.lock.json: los workflows compartidos de pf2e-baron-core solo sirven a modulos que vendorizan el core. Corre node <core>/tools/sync-core.mjs --ref <etiqueta> y haz commit de lo que escribe (scripts/baron-core.js, el lock y los pins de .github/workflows) junto con este workflow");
              process.exit(1);
            }
            const lock = JSON.parse(fs.readFileSync("baron-core.lock.json", "utf8"));
            if (!/^[0-9a-f]{40}$/.test(lock.commit ?? "")) {
              console.log("::error file=baron-core.lock.json::lock.commit no es un sha de 40 caracteres (" + JSON.stringify(lock.commit) + "): si dice dev, la copia viene de sync-core --watch; corre sync-core --ref <etiqueta>");
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit=" + lock.commit + "\n");
            console.log("baron-core " + lock.version + " @ " + lock.commit);
          '

      - name: Checkout de pf2e-baron-core en el commit del lock
        uses: actions/checkout@v4
        with:
          repository: BaronHVC/pf2e-baron-core
          ref: ${{ steps.lock.outputs.commit }}
          path: .baron-core
          # Historia completa: check-module --online necesita las etiquetas.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reemplaza los dos pasos de validacion del release.yml de SWE (archivos
      # declarados, node --check, JSON, paridad en/es) y agrega el resto de
      # check-module: copia del core contra el lock, imports, claves i18n,
      # identificadores persistidos, placeholders, la licencia de Paizo
      # (baron.json paizo contra el modo y NOTICE.md) y, en mode protected, la
      # landingUrl y el requires a la base gratuita (revision m). Con --release,
      # un valor de lang/*.json o el title/description de module.json que
      # todavia empieza con TODO-HUMANO: falla (revision n): la politica de IA
      # de Foundry pide texto escrito por una persona. Tambien falla un
      # NOTICE.md con un campo de la ORC sin llenar o un renglon con PENDIENTE:
      # (dato legal que espera la firma del autor, revision l). En cada push
      # todo esto solo avisa.
      - name: Validar que las fuentes no esten rotas (check-module --online --release)
        run: node .baron-core/tools/check-module.mjs . --core-repo .baron-core --online --release

      # Las mismas pruebas del modulo que module-check.yml corre en cada push
      # (npm test o node --test sobre test/ y tests/; ver alli), aqui antes de
      # reescribir module.json y de armar el ZIP: una etiqueta con una prueba
      # roja no publica, ni en mode public ni en protected. Corren sobre el
      # checkout tal cual esta en la etiqueta, y su reporte TAP va a
      # RUNNER_TEMP, fuera de lo que se empaca.
      - name: Pruebas del modulo
        run: node .baron-core/.github/scripts/run-module-tests.mjs .

      - name: Leer la version desde la etiqueta
        id: v
        run: |
          # Solo una etiqueta da version: corrido desde una rama, esto
          # publicaria un release con el nombre de la rama.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::module-release corre solo al empujar una etiqueta v* (on: push: tags), no en $GITHUB_REF"
            exit 1
          fi
          TAG="$GITHUB_REF_NAME"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # Una etiqueta que no sea vX.Y.Z (por ejemplo v0.7.0-rc1) se publica
          # como prerelease, y eso cambia tambien a donde apunta el manifest.
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Etiqueta: $TAG -> version ${TAG#v}"

      - name: Escribir version, download y manifest en module.json
        env:
          TAG: ${{ steps.v.outputs.tag }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
          MODE: ${{ steps.baron.outputs.mode }}
          LANDING_URL: ${{ steps.baron.outputs.landingUrl }}
        run: |
          # public: version de la etiqueta, download en el release de la
          # etiqueta y manifest en releases/latest (estable) o en el release de
          # la etiqueta (prerelease, que "latest" nunca resuelve).
          # protected: "protected": true, sin download, manifest en
          # r2.foundryvtt.com, url = landingUrl; falla si queda un enlace a GitHub.
          CHANNEL=stable
          if [ "$PRERELEASE" = "true" ]; then CHANNEL=prerelease; fi
          ARGS=(module.json --tag "$TAG" --repo "$GITHUB_REPOSITORY" --channel "$CHANNEL" --mode "$MODE")
          if [ "$MODE" = "protected" ]; then ARGS+=(--landing-url "$LANDING_URL"); fi
          node .baron-core/tools/release-manifest.mjs "${ARGS[@]}"

      - name: Armar el ZIP
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          MODULE_ID=$(node -p "require('./module.json').id")
          echo "MODULE_ID=$MODULE_ID" >> "$GITHUB_ENV"
          # No llamar a esta variable ZIP: Info-ZIP lee $ZIP como argumentos por
          # defecto, asi que exportarla hace que toda llamada posterior a zip
          # reciba este nombre como archivo destino y trate el suyo como patron
          # de entrada, escribiendo en el paquete equivocado sin dar error.
          echo "ZIP_NAME=$MODULE_ID-$TAG.zip" >> "$GITHUB_ENV"
          # Se respeta la carpeta interna que ya usaban tus ZIPs anteriores
          mkdir -p "build/$MODULE_ID"
          # Solo lo que Foundry carga, mas la licencia y los avisos legales, y
          # solo lo que este modulo tenga. MIT y ORC exigen que el aviso viaje
          # con cada copia, y el ZIP es la copia que reciben los usuarios. Nunca
          # entran .baron-core, tools, baron.json, baron-core.lock.json ni .github;
          # la copia del core viaja dentro de scripts/.
          PARTS=()
          for p in module.json scripts styles templates lang packs LICENSE NOTICE.md; do
            if [ -e "$p" ]; then PARTS+=("$p"); fi
          done
          cp -r "${PARTS[@]}" "build/$MODULE_ID/"
          (cd build && zip -r "../$MODULE_ID-$TAG.zip" "$MODULE_ID")
          echo "--- contenido del ZIP ---"
          unzip -l "$MODULE_ID-$TAG.zip"

      - name: Publicar el release con sus dos archivos
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          # GitHub excluye los prerelease al resolver "releases/latest", que es la
          # URL de actualizacion de las versiones estables: asi una prueba nunca se
          # le ofrece como actualizacion a los usuarios reales.
          # En mode protected este release queda en el repo privado: solo lo ven
          # sus colaboradores, y de aqui se baja el ZIP para subirlo a Foundry.
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS="--prerelease"
            echo "::notice::$TAG no es una version estable: se publica como prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El release $TAG ya existe: se reemplazan los archivos"
            gh release upload "$TAG" module.json "$ZIP_NAME" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              $FLAGS \
              module.json "$ZIP_NAME"
          fi

      # Modulo de pago: Foundry no tiene API para subir paquetes protegidos, asi
      # que el resto es a mano. La lista queda en el resumen del run y un aviso
      # en el log apunta a ella. Una prerelease nunca se sube: Foundry tomaria
      # la estable X.Y.Z por mas vieja que X.Y.Z-rc.N (compara por segmentos y
      # como texto), asi que su resumen dice como probar en su lugar.
      - name: Lista para subir el modulo de pago a Foundry
        if: steps.baron.outputs.mode == 'protected'
        env:
          TAG: ${{ steps.v.outputs.tag }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const { GITHUB_REPOSITORY, GITHUB_SERVER_URL, GITHUB_STEP_SUMMARY, TAG, PRERELEASE, ZIP_NAME } = process.env;
            const release = (GITHUB_SERVER_URL || "https://github.com") + "/" + GITHUB_REPOSITORY + "/releases/tag/" + encodeURIComponent(TAG);
            const c = m.compatibility || {};
            const compat = ["minimum", "verified", "maximum"].filter((k) => c[k] !== undefined && c[k] !== "").map((k) => k + " `" + c[k] + "`").join(", ") || "(module.json no declara compatibility)";
            // La base gratuita va sin manifest (seria un enlace a GitHub):
            // Foundry la encuentra solo por su id en foundryvtt.com.
            const req = (m.relationships && Array.isArray(m.relationships.requires)) ? m.relationships.requires : [];
            const bases = req.filter((r) => r && typeof r.id === "string" && r.id && (r.type || "module") === "module").map((r) => "`" + r.id + "`").join(", ");
            const stable = m.version.replace(/[-+].*$/, "");
            const lines = PRERELEASE === "true" ? [
              "## Prerelease protegida: `" + m.id + "` " + m.version + " (no se sube a Foundry)",
              "",
              "La CI armo el paquete protegido y lo dejo en el release [" + TAG + "](" + release + ") de este repo privado, solo para comprobar que se arma.",
              "",
              "- [ ] No subas esta version a Foundry: compara versiones por segmentos y como texto, asi que la estable `" + stable + "` nunca contaria como mas nueva que `" + m.version + "` y los mecenas se quedarian en la prueba.",
              "- [ ] No instales este ZIP a mano: su module.json lleva protected en true, y Foundry esconde un paquete protegido de tu propia instalacion (v14 lo rechaza sin firma).",
              "- [ ] Prueba el codigo desde la copia de trabajo, enlazada a Foundry con tools/link-foundry.ps1.",
              "- [ ] Cuando este lista, etiqueta la estable (`v" + stable + "`): el resumen de ese run trae la lista para subirla a Foundry.",
            ] : [
              "## Subida manual a Foundry: `" + m.id + "` " + m.version,
              "",
              "La CI ya armo el paquete protegido; Foundry no tiene API para subirlo, asi que lo que sigue es a mano. Requisito previo, una sola vez: el Premium Content Agreement de Foundry firmado en la cuenta de creador" + (bases ? ", y la base gratuita (" + bases + ") publicada en foundryvtt.com con ese mismo id: el manifiesto protegido no lleva su manifest, asi que Foundry la encuentra solo por su id." : "."),
              "",
              "- [ ] Descarga `" + ZIP_NAME + "` del release [" + TAG + "](" + release + ") de este repo privado.",
              "- [ ] Subelo en https://foundryvtt.com/creators/upload al paquete `" + m.id + "`, version `" + m.version + "`, compatibilidad " + compat + ".",
              "- [ ] Si es la primera version del paquete, espera la aprobacion de Foundry antes de anunciarla.",
              "- [ ] En la pagina del paquete en foundryvtt.com, asigna (o revisa, si ya existen) los niveles (tiers) de Patreon que dan acceso: sin un nivel asignado, ningun mecenas puede instalarlo.",
              "- [ ] Prueba la instalacion desde una cuenta de mecenas (con Patreon vinculado en su perfil de foundryvtt.com)" + (bases ? "; Foundry tiene que instalar tambien " + bases : "") + ". Manifest del paquete: " + m.manifest,
            ];
            fs.appendFileSync(GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            if (PRERELEASE === "true") console.log("::notice title=Prerelease protegida::" + m.id + " " + m.version + ": no la subas a Foundry; prueba desde la copia de trabajo (detalles en el resumen del run)");
            else console.log("::notice title=Subida manual pendiente::" + m.id + " " + m.version + ": baja " + ZIP_NAME + " de este release y subelo en https://foundryvtt.com/creators/upload (la lista completa esta en el resumen del run)");
          '

      # Canal de pruebas: una etiqueta fija cuyos archivos se reemplazan en cada
      # prerelease, para instalar siempre desde la misma URL. El release por
      # version sigue existiendo aparte, para poder volver a una rc concreta.
      # Corre en TODO release, no solo prereleases: si no, publicar estables
      # directas deja el canal congelado y las instalaciones que vinieron de el
      # nunca ven la version nueva (paso con la v0.9.x: dev quedo en 0.8.0.21).
      # Un modulo lo apaga con "devChannel": false en baron.json. Un modulo de
      # pago (mode protected) nunca lo usa: Leer baron.json deja devChannel en
      # false, y la condicion lo repite por si acaso.
      - name: Actualizar el canal de pruebas
        if: steps.baron.outputs.devChannel == 'true' && steps.baron.outputs.mode == 'public'
        # El canal de pruebas es una comodidad, no parte del release: si falla,
        # la version publicada arriba sigue siendo valida y el run no se marca
        # como fallido por esto.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # El log del workflow solo lo puede descargar quien tenga permisos de
          # admin en el repo. Este paso guarda su propia salida y la adjunta al
          # release para poder diagnosticarlo desde afuera.
          set +e
          {
          set -x
          DEV_ZIP="$GITHUB_WORKSPACE/$MODULE_ID-dev.zip"
          # Version numerica X.Y.Z.<run> que siempre crece (Foundry compara
          # "0.7.0-rc10" como texto y la tomaria por mas vieja que rc9), con
          # manifest y download en el release fijo "dev".
          node .baron-core/tools/release-manifest.mjs module.json --tag "$TAG" --repo "$GITHUB_REPOSITORY" --channel dev --run-number "$GITHUB_RUN_NUMBER"
          cp module.json "build/$MODULE_ID/module.json"
          rm -f "$DEV_ZIP"
          (cd build && zip -r "$DEV_ZIP" "$MODULE_ID")
          echo "--- contenido del paquete de pruebas ---"
          unzip -l "$DEV_ZIP"
          NOTES="Canal de pruebas. Los archivos de este release se reemplazan en cada version de prueba, asi la URL de instalacion no cambia. Contenido actual: $TAG (version $VERSION). Para una version concreta, usa su propio release."
          if gh release view dev; then
            echo "El canal ya existe: se reemplazan sus archivos"
            gh release upload dev module.json "$DEV_ZIP" --clobber
            gh release edit dev --notes "$NOTES"
          else
            echo "Creando el canal por primera vez en $GITHUB_SHA"
            # --target explicito: la etiqueta "dev" no existe todavia y el
            # checkout de un tag deja el repo en HEAD desasociado, asi que se le
            # dice exactamente sobre que commit crearla.
            gh release create dev \
              --target "$GITHUB_SHA" \
              --title "Canal de pruebas" \
              --notes "$NOTES" \
              --prerelease \
              module.json "$DEV_ZIP"
          fi
          echo "Estado final del canal:"
          gh release view dev --json tagName,isPrerelease,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[].name]}'
          } > dev-channel.log 2>&1
          RC=$?
          echo "exit_code=$RC" >> dev-channel.log
          cat dev-channel.log
          gh release upload "$TAG" dev-channel.log --clobber || true
